# Runs on every pull request and on main.
# Every action is pinned to an exact commit, and downloaded tools are checked against published checksums.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks 8.30.1 (whole history)
        run: |
          V=8.30.1
          cd "$RUNNER_TEMP"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --no-banner --redact -v
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install pip-audit (hash-pinned)
        run: python -m pip install --require-hashes --no-deps -r .github/pip-audit-requirements.txt
      - name: Dependency audit (fails on any known vulnerability)
        run: pip-audit --require-hashes --disable-pip --progress-spinner off -r tools/themes/requirements.txt
