# Theme:        Teal Vocaldroid
# Author:       Oddlogic
# Source:       https://github.com/oddlogic-space/oddlogic-rockbox-themes  (latest version, changelog, bug reports)
# Platform:     HiBy R1 (480x800 portrait touch), Rockbox hosted build (Unsupported/hosted)
# Version:      1.1
# License:      CC-BY-SA 4.0 (skins, graphics). Fonts: SIL Open Font License 1.1 (derived from Noto Sans CJK)
# Graphics:     All graphics generated by the author with a script (no third-party images)
# Last updated: 2026-10-14
#
# Dark desaturated-teal palette, piano-roll title plate, live L/R level meters.
# IMPORTANT: touch buttons need  Settings > General Settings > Display >
#   Touchscreen Settings > Touchscreen mode > Point
# (the R1 defaults to "Grid", where skin touch regions do nothing)
wps: /.rockbox/wps/tealvocaldroid.wps
sbs: /.rockbox/wps/tealvocaldroid.sbs
font: /.rockbox/fonts/32-tealvocaldroid.fnt
backdrop: -
show icons: on
filetype colours: -
statusbar: top
scrollbar: off
foreground color: D8EEEC
background color: 0F1A1C
line selector start color: 1F5F5A
line selector end color: 2A8B84
line selector text color: F2FFFD
selector type: bar (gradient)
ui viewport: -
list padding: 14
